<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Screen Mockup Generator — Overwolf Creatives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <!-- Header — matches creative-conversion -->
    <header class="app-header">
      <div class="header-left">
        <img src="assets/overwolf-logo.svg" alt="Overwolf" class="header-logo" height="24" />
        <span class="header-divider"></span>
        <h1 class="header-title">3D Screen Mockup Generator</h1>
      </div>
      <div class="header-actions">
        <button class="btn-m btn-ghost" id="btnReset">RESET</button>
      </div>
    </header>

    <!-- Main layout -->
    <div class="main-layout">
      <!-- Viewport -->
      <div class="viewport-wrap">
        <div class="viewport" id="viewport">
          <div class="checkerboard" id="checkerboard"></div>
          <!-- Capture wrapper — this is what gets exported -->
          <div class="capture-area" id="captureArea">
            <div class="scene" id="scene">
              <div class="screen-wrapper" id="screenWrapper">
                <div class="screen" id="screen">
                  <div class="screen-content" id="screenContent">
                    <div class="upload-prompt" id="uploadPrompt">
                      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <path d="M24 8L24 32M24 8L16 16M24 8L32 16" stroke="var(--color-text-tertiary, #9F9F9F)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 28V36C8 38.2 9.8 40 12 40H36C38.2 40 40 38.2 40 36V28" stroke="var(--color-text-tertiary, #9F9F9F)" stroke-width="2.5" stroke-linecap="round"/>
                      </svg>
                      <span class="upload-text">Drop image here or click to upload</span>
                    </div>
                    <img id="screenImage" class="screen-image" alt="" />
                  </div>
                  <div class="screen-gloss" id="screenGloss"></div>
                </div>
                <div class="screen-shadow" id="screenShadow"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="drag-hint" id="dragHint">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L9 4M13 8L9 12M8 3V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Drag to rotate
        </div>
      </div>

      <!-- Controls Panel -->
      <aside class="controls-panel" id="controlsPanel">
        <div class="panel-section">
          <h2 class="panel-title">Image</h2>
          <label class="btn-m btn-primary upload-btn-wrap" for="fileInput">
            UPLOAD IMAGE
            <input type="file" id="fileInput" accept="image/*" hidden />
          </label>
        </div>

        <div class="panel-divider"></div>

        <div class="panel-section">
          <h2 class="panel-title">Screen Shape</h2>
          <div class="control-row"><label class="control-label">Corner Radius</label><div class="slider-row"><input type="range" class="ow-slider" id="cornerRadius" min="0" max="80" value="12" /><span class="slider-value" id="cornerRadiusVal">12px</span></div></div>
          <div class="control-row"><label class="control-label">Bezel</label><div class="slider-row"><input type="range" class="ow-slider" id="bezel" min="0" max="32" value="0" /><span class="slider-value" id="bezelVal">0px</span></div></div>
          <div class="control-row"><label class="control-label">Bezel Color</label><div class="color-row"><input type="color" id="bezelColor" value="#1a1a1a" class="color-input" /><input type="text" id="bezelColorHex" value="#1a1a1a" class="hex-input" maxlength="7" /></div></div>
        </div>

        <div class="panel-divider"></div>

        <div class="panel-section">
          <h2 class="panel-title">3D Angle</h2>
          <div class="control-row"><label class="control-label">Rotate X</label><div class="slider-row"><input type="range" class="ow-slider" id="rotateX" min="-45" max="45" value="0" /><span class="slider-value" id="rotateXVal">0°</span></div></div>
          <div class="control-row"><label class="control-label">Rotate Y</label><div class="slider-row"><input type="range" class="ow-slider" id="rotateY" min="-45" max="45" value="0" /><span class="slider-value" id="rotateYVal">0°</span></div></div>
          <div class="control-row"><label class="control-label">Perspective</label><div class="slider-row"><input type="range" class="ow-slider" id="perspective" min="400" max="2000" value="900" /><span class="slider-value" id="perspectiveVal">900</span></div></div>
          <div class="control-row"><label class="control-label">Scale</label><div class="slider-row"><input type="range" class="ow-slider" id="scale" min="30" max="150" value="80" /><span class="slider-value" id="scaleVal">80%</span></div></div>
          <div class="control-row checkbox-row"><label class="control-label">Mouse Control</label><label class="ow-switch"><input type="checkbox" id="mouseControl" checked /><span class="switch-track"></span></label></div>
          <div class="control-row checkbox-row"><label class="control-label">Orthographic</label><label class="ow-switch"><input type="checkbox" id="orthographic" /><span class="switch-track"></span></label></div>
        </div>

        <div class="panel-divider"></div>

        <div class="panel-section">
          <h2 class="panel-title">Lighting</h2>
          <div class="control-row"><label class="control-label">Gloss Intensity</label><div class="slider-row"><input type="range" class="ow-slider" id="glossIntensity" min="0" max="100" value="30" /><span class="slider-value" id="glossIntensityVal">30%</span></div></div>
          <div class="control-row"><label class="control-label">Gloss Angle</label><div class="slider-row"><input type="range" class="ow-slider" id="glossAngle" min="0" max="360" value="135" /><span class="slider-value" id="glossAngleVal">135°</span></div></div>
          <div class="control-row"><label class="control-label">Gloss Color</label><div class="color-row"><input type="color" id="glossColor" value="#ffffff" class="color-input" /><input type="text" id="glossColorHex" value="#ffffff" class="hex-input" maxlength="7" /></div></div>
          <div class="control-row"><label class="control-label">Shadow Strength</label><div class="slider-row"><input type="range" class="ow-slider" id="shadowIntensity" min="0" max="100" value="40" /><span class="slider-value" id="shadowIntensityVal">40%</span></div></div>
          <div class="control-row"><label class="control-label">Shadow Spread</label><div class="slider-row"><input type="range" class="ow-slider" id="shadowSpread" min="10" max="120" value="50" /><span class="slider-value" id="shadowSpreadVal">50</span></div></div>
          <div class="control-row"><label class="control-label">Shadow Color</label><div class="color-row"><input type="color" id="shadowColor" value="#000000" class="color-input" /><input type="text" id="shadowColorHex" value="#000000" class="hex-input" maxlength="7" /></div></div>
        </div>

        <div class="panel-divider"></div>

        <div class="panel-section">
          <h2 class="panel-title">Background</h2>
          <div class="bg-options">
            <button class="bg-option active" data-bg="transparent"><span class="bg-swatch bg-checker"></span><span>Transparent</span></button>
            <button class="bg-option" data-bg="color"><span class="bg-swatch" id="bgColorSwatch" style="background:#000"></span><span>Color</span></button>
            <button class="bg-option" data-bg="greenscreen"><span class="bg-swatch" style="background:#00FF00"></span><span>Green</span></button>
          </div>
          <div class="color-row hidden" id="bgColorPickerRow">
            <input type="color" id="bgColorPicker" value="#000000" class="color-input" />
            <input type="text" id="bgColorHex" value="#000000" class="hex-input" maxlength="7" />
          </div>
        </div>

        <div class="panel-divider"></div>

        <div class="panel-section">
          <h2 class="panel-title">Animation</h2>
          <div class="control-row checkbox-row"><label class="control-label">Hover Loop</label><label class="ow-switch"><input type="checkbox" id="animateHover" /><span class="switch-track"></span></label></div>
          <div class="control-row hidden" id="animSpeedRow"><label class="control-label">Speed</label><div class="slider-row"><input type="range" class="ow-slider" id="animSpeed" min="1" max="10" value="4" /><span class="slider-value" id="animSpeedVal">4s</span></div></div>
          <div class="control-row hidden" id="animAmplitudeRow"><label class="control-label">Amplitude</label><div class="slider-row"><input type="range" class="ow-slider" id="animAmplitude" min="2" max="30" value="12" /><span class="slider-value" id="animAmplitudeVal">12°</span></div></div>
        </div>

        <div class="panel-divider"></div>

        <div class="panel-section">
          <h2 class="panel-title">Export</h2>
          <div class="control-row"><label class="control-label">Resolution</label><div class="slider-row"><input type="range" class="ow-slider" id="exportScale" min="1" max="4" value="2" step="1"/><span class="slider-value" id="exportScaleVal">2×</span></div></div>
          <button class="btn-m btn-primary" id="btnExportPng">DOWNLOAD PNG</button>
          <button class="btn-m btn-secondary hidden" id="btnExportWebm">DOWNLOAD WEBM</button>
        </div>
      </aside>
    </div>

    <!-- Footer — matches creative-conversion -->
    <footer class="app-footer">
      <span class="footer-text">Overwolf Creatives Internal Tools</span>
    </footer>
  </div>

  <!-- Drop overlay -->
  <div class="drop-overlay" id="dropOverlay">
    <div class="drop-overlay-inner">
      <svg width="56" height="56" viewBox="0 0 48 48" fill="none">
        <path d="M24 8L24 32M24 8L16 16M24 8L32 16" stroke="#D34037" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 28V36C8 38.2 9.8 40 12 40H36C38.2 40 40 38.2 40 36V28" stroke="#D34037" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span>Drop image to load</span>
    </div>
  </div>

  <!-- Recording overlay -->
  <div class="record-overlay" id="recordOverlay">
    <div class="record-overlay-inner">
      <div class="record-dot"></div>
      <span class="record-label">Recording in progress</span>
      <div class="record-progress-track"><div class="record-progress-fill" id="recordProgressFill"></div></div>
      <span class="record-frame-count" id="recordFrameCount">0 / 0 frames</span>
    </div>
  </div>

  <!-- Three.js r128 for WebGL-based export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
